services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: video_note
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video_note}
      POSTGRES_DB: video_note
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  video-note:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      DATABASE_URL: postgresql+psycopg2://video_note:${POSTGRES_PASSWORD:-video_note}@db:5432/video_note
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-}
      RECHARGE_WHITELIST: ${RECHARGE_WHITELIST:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL}
      BILI_COOKIES_FILE: /data/bili_cookies.txt
      COOKIE_BROWSER: none
      ENABLE_LOCAL_WHISPER: "0"
    depends_on:
      - db
    restart: unless-stopped
